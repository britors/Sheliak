<?xml version="1.0" encoding="UTF-8"?>
<!-- Lyra OS — wordmark (texto "Lyra OS"), vetor puro. "Lyra" em tom claro,
     "OS" no degradê ciano->magenta da marca. -->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="160" viewBox="0 0 600 160">
  <defs>
    <linearGradient id="lyraOsGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18B4E0"/>
      <stop offset="50%" stop-color="#685BCA"/>
      <stop offset="100%" stop-color="#9530D6"/>
    </linearGradient>
  </defs>
  <text x="10" y="120" font-family="sans-serif" font-weight="bold" font-size="110" fill="#E8ECFF">Lyra</text>
  <text x="260" y="120" font-family="sans-serif" font-weight="bold" font-size="110" fill="url(#lyraOsGradient)">OS</text>
</svg>
